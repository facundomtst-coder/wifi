<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi gratis</title>
<meta name="theme-color" content="#111827">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main>
  <header>
    <div id="logo"></div>
    <h1 id="nombre-negocio"></h1>
    <p class="sub">WiFi gratis para clientes</p>
  </header>

  <!-- Paso 1: el cliente deja sus datos -->
  <section class="card" id="paso-form">
    <h2>Conectate al WiFi</h2>
    <p class="hint">Dejanos tu nombre y WhatsApp y te mostramos la clave.</p>
    <form id="form" novalidate>
      <label for="f-nombre">Nombre</label>
      <input id="f-nombre" type="text" autocomplete="given-name" required>
      <label for="f-tel">WhatsApp</label>
      <input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 362 4123456" required>
      <label class="check">
        <input id="f-acepta" type="checkbox" checked>
        <span id="texto-acepta"></span>
      </label>
      <button id="btn-enviar" type="submit">Ver la clave del WiFi</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </section>

  <!-- Paso 2: datos del WiFi -->
  <section class="card" id="paso-2" hidden>
    <h2>¡Listo! Estos son los datos</h2>
    <div class="dato">
      <div><small>Red</small><strong id="w-red"></strong></div>
      <button class="copiar" data-copiar="red">Copiar</button>
    </div>
    <div class="dato">
      <div><small>Clave</small><strong id="w-clave"></strong></div>
      <button class="copiar" data-copiar="clave">Copiar</button>
    </div>
    <p class="hint" style="margin:14px 0 0">¿Venís acompañado? Que escaneen este código con la cámara y se conectan solos:</p>
    <div id="qr"></div>
  </section>

  <!-- Enlaces del negocio -->
  <section class="links" id="links" hidden></section>

  <footer id="pie"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
  // Formato estándar que reconocen las cámaras de Android e iPhone
  function escaparWifi(s) { return s.replace(/([\\;,:"])/g, '\\$1'); }

  document.querySelectorAll('[data-copiar]').forEach(b => {
    b.addEventListener('click', () => copiar(b, b.dataset.copiar === 'red' ? C.wifi.red : C.wifi.clave));
  });

  iniciarPagina({
    titulo: 'WiFi',
    origen: 'wifi',
    incluirWhatsapp: true,
    mostrar() {
      document.getElementById('w-red').textContent = C.wifi.red;
      document.getElementById('w-clave').textContent = C.wifi.clave;
      const qr = document.getElementById('qr');
      qr.innerHTML = '';
      new QRCode(qr, {
        text: 'WIFI:T:' + (C.wifi.seguridad || 'WPA') + ';S:' + escaparWifi(C.wifi.red) + ';P:' + escaparWifi(C.wifi.clave) + ';;',
        width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M
      });
    }
  });
</script>
</body>
</html>
