<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi gratis</title>
<meta name="theme-color" content="#111827">
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b6f76;
    --line: #e4e0d8;
    --accent: #ef9420;        /* naranja del logo */
    --accent-text: #1c1c1e;   /* texto oscuro: el blanco sobre naranja no se lee bien */
    --ok: #1f7a4d;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #eef0f2;
      --muted: #9aa0a8;
      --line: #2c3037;
      --accent: #ef9420;
      --accent-text: #1c1c1e;
      --ok: #5cc28f;
      --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; padding: 28px 16px 40px; }
  header { text-align: center; margin-bottom: 22px; }
  .logo {
    display: block; width: 100%; max-width: 340px; height: auto;
    margin: 0 auto 10px; border-radius: 14px;
  }
  .logo-letra {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text);
    font-size: 36px; font-weight: 700;
  }
  h1 { font-size: 24px; margin: 12px 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card p.hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 13px 14px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--muted); font-size: 13px; }
  .check input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  button, .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px; margin-top: 16px;
    font: inherit; font-weight: 600; text-decoration: none;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--error); font-size: 14px; margin: 10px 0 0; min-height: 1em; }
  .dato { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dato:last-of-type { border-bottom: 0; }
  .dato small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .dato strong { font-size: 19px; overflow-wrap: anywhere; }
  .copiar {
    width: auto; margin: 0; padding: 9px 14px; font-size: 14px; flex: none;
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  .copiado { color: var(--ok); border-color: var(--ok); }
  #qr { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 12px; width: fit-content; margin: 8px auto 0; }
  .links .btn { background: var(--bg); color: var(--text); border: 1px solid var(--line); margin-top: 10px; justify-content: flex-start; }
  .links .btn.destacado { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .links svg { width: 22px; height: 22px; flex: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div id="logo"></div>
    <h1 id="nombre-negocio"></h1>
    <p class="sub">WiFi gratis para clientes</p>
  </header>

  <!-- Paso 1: el cliente deja sus datos -->
  <section class="card" id="paso-form">
    <h2>Conectate al WiFi</h2>
    <p class="hint">Dejanos tu nombre y WhatsApp y te mostramos la clave.</p>
    <form id="form" novalidate>
      <label for="f-nombre">Nombre</label>
      <input id="f-nombre" type="text" autocomplete="given-name" required>
      <label for="f-tel">WhatsApp</label>
      <input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 362 4123456" required>
      <label class="check">
        <input id="f-acepta" type="checkbox" checked>
        <span id="texto-acepta"></span>
      </label>
      <button id="btn-enviar" type="submit">Ver la clave del WiFi</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </section>

  <!-- Paso 2: datos del WiFi -->
  <section class="card" id="paso-wifi" hidden>
    <h2>¡Listo! Estos son los datos</h2>
    <div class="dato">
      <div><small>Red</small><strong id="w-red"></strong></div>
      <button class="copiar" data-copiar="red">Copiar</button>
    </div>
    <div class="dato">
      <div><small>Clave</small><strong id="w-clave"></strong></div>
      <button class="copiar" data-copiar="clave">Copiar</button>
    </div>
    <p class="hint" style="margin:14px 0 0">¿Venís acompañado? Que escaneen este código con la cámara y se conectan solos:</p>
    <div id="qr"></div>
  </section>

  <!-- Enlaces del negocio -->
  <section class="links" id="links" hidden></section>

  <footer id="pie"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
  const C = window.CONFIG;
  const LS_KEY = 'wifi-registrado-v1';

  // --- Cabecera ---
  document.title = 'WiFi · ' + C.negocio;
  document.getElementById('nombre-negocio').textContent = C.negocio;
  document.getElementById('texto-acepta').textContent =
    'Acepto que ' + C.negocio + ' me escriba por WhatsApp con novedades y promociones.';
  document.getElementById('pie').textContent = C.negocio + (C.direccion ? ' · ' + C.direccion : '');
  const logo = document.getElementById('logo');
  if (C.logo) {
    logo.innerHTML = '<img class="logo">';
    logo.firstChild.src = C.logo;
    logo.firstChild.alt = C.negocio;
    // El logo ya trae el nombre, no lo repetimos
    document.getElementById('nombre-negocio').hidden = true;
  } else {
    logo.innerHTML = '<div class="logo-letra"></div>';
    logo.firstChild.textContent = C.negocio.trim().charAt(0).toUpperCase();
  }

  // --- Enlaces ---
  const ICONOS = {
    resena: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
    web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>'
  };
  const ENLACES = [
    { clave: 'resena', texto: 'Dejanos tu reseña en Google', url: C.enlaces.resenaGoogle, destacado: true },
    { clave: 'instagram', texto: 'Seguinos en Instagram', url: C.enlaces.instagram },
    { clave: 'whatsapp', texto: 'Escribinos por WhatsApp', url: C.enlaces.whatsapp && 'https://wa.me/' + C.enlaces.whatsapp.replace(/\D/g, '') },
    { clave: 'web', texto: 'Visitá nuestra web', url: C.enlaces.web }
  ];
  const links = document.getElementById('links');
  for (const e of ENLACES) {
    if (!e.url) continue;
    const a = document.createElement('a');
    a.className = 'btn' + (e.destacado ? ' destacado' : '');
    a.href = e.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = ICONOS[e.clave] + '<span></span>';
    a.querySelector('span').textContent = e.texto;
    links.appendChild(a);
  }

  // --- WiFi ---
  // Formato estándar que reconocen las cámaras de Android e iPhone
  function escaparWifi(s) { return s.replace(/([\\;,:"])/g, '\\$1'); }
  function mostrarWifi() {
    document.getElementById('paso-form').hidden = true;
    document.getElementById('paso-wifi').hidden = false;
    links.hidden = false;
    document.getElementById('w-red').textContent = C.wifi.red;
    document.getElementById('w-clave').textContent = C.wifi.clave;
    const qr = document.getElementById('qr');
    qr.innerHTML = '';
    new QRCode(qr, {
      text: 'WIFI:T:' + (C.wifi.seguridad || 'WPA') + ';S:' + escaparWifi(C.wifi.red) + ';P:' + escaparWifi(C.wifi.clave) + ';;',
      width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M
    });
  }

  document.querySelectorAll('[data-copiar]').forEach(b => {
    b.addEventListener('click', async () => {
      const valor = b.dataset.copiar === 'red' ? C.wifi.red : C.wifi.clave;
      try { await navigator.clipboard.writeText(valor); } catch (_) {
        const t = document.createElement('textarea');
        t.value = valor; document.body.appendChild(t); t.select();
        document.execCommand('copy'); t.remove();
      }
      b.textContent = '¡Copiado!'; b.classList.add('copiado');
      setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('copiado'); }, 1800);
    });
  });

  // --- Formulario ---
  function yaRegistrado() {
    try { return localStorage.getItem(LS_KEY) === '1'; } catch (_) { return false; }
  }
  function marcarRegistrado() {
    try { localStorage.setItem(LS_KEY, '1'); } catch (_) {}
  }

  document.getElementById('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const nombre = document.getElementById('f-nombre').value.trim();
    const tel = document.getElementById('f-tel').value.replace(/[^\d+]/g, '');
    const acepta = document.getElementById('f-acepta').checked;
    const error = document.getElementById('error');
    error.textContent = '';
    if (nombre.length < 2) { error.textContent = 'Escribí tu nombre.'; return; }
    if (tel.replace(/\D/g, '').length < 8) { error.textContent = 'Revisá el número de WhatsApp.'; return; }

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true; btn.textContent = 'Un segundo…';
    if (C.urlPlanilla) {
      try {
        // text/plain evita el "preflight" CORS que Apps Script no responde
        await fetch(C.urlPlanilla, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ nombre, telefono: tel, acepta, origen: location.search.slice(1) || 'placa' })
        });
      } catch (_) {
        // Si falla la red igual le damos el WiFi: el cliente no tiene la culpa
      }
    }
    marcarRegistrado();
    mostrarWifi();
  });

  if (yaRegistrado()) mostrarWifi();
</script>
</body>
</html>
